<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockTracker — Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #03030a; color: #f0f0f0; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; overflow-y: auto; }
        #bg-canvas { position: fixed; inset: 0; z-index: 0; }
        .scene { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; padding: 30px 20px; min-height: 100vh; }
        .glass-panel {
            width: 100%; max-width: 460px;
            background: rgba(8,8,20,0.78);
            border: 1px solid rgba(108,99,255,0.25);
            border-radius: 28px; padding: 44px 42px;
            backdrop-filter: blur(40px) saturate(180%);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.05) inset, 0 40px 80px rgba(0,0,0,0.6), 0 0 60px rgba(108,99,255,0.08);
            transform: translateY(40px); opacity: 0;
            animation: panelIn 0.9s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
        }
        @keyframes panelIn { to { transform: translateY(0); opacity: 1; } }

        .logo-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
        .logo-3d {
            width: 48px; height: 48px; border-radius: 14px;
            background: linear-gradient(135deg, #6c63ff, #00d4ff);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 32px rgba(108,99,255,0.5);
            animation: logoFloat 3s ease-in-out infinite;
        }
        @keyframes logoFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .logo-3d svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .logo-name { font-size: 1.2rem; font-weight: 800; background: linear-gradient(135deg, #fff, #aaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-sub { font-size: 0.65rem; color: #556; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; }

        .heading { font-size: 1.75rem; font-weight: 800; line-height: 1.1; margin-bottom: 6px; letter-spacing: -0.5px; }
        .heading span { background: linear-gradient(120deg, #6c63ff, #00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subheading { color: #556; font-size: 0.88rem; margin-bottom: 28px; }

        .field { margin-bottom: 15px; }
        .field label { display: block; font-size: 0.72rem; font-weight: 600; color: #667; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 7px; }
        .input-wrap { position: relative; }
        .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #445; transition: color 0.2s; pointer-events: none; }
        .input-icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .field input {
            width: 100%; padding: 13px 14px 13px 44px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
            border-radius: 13px; color: #fff; font-size: 0.92rem;
            font-family: 'Inter', sans-serif; transition: all 0.25s; outline: none;
        }
        .field input:focus { border-color: rgba(108,99,255,0.6); background: rgba(108,99,255,0.06); box-shadow: 0 0 0 3px rgba(108,99,255,0.12); }
        .input-wrap:focus-within .input-icon { color: #6c63ff; }
        .field input::placeholder { color: #334; }

        .optional-tag { font-size: 0.65rem; color: #445; font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 6px; }

        .btn-register {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #6c63ff 0%, #00d4ff 100%);
            color: #fff; border: none; border-radius: 14px;
            font-weight: 700; font-size: 0.98rem; cursor: pointer;
            font-family: 'Inter', sans-serif; transition: all 0.3s;
            position: relative; overflow: hidden; margin-top: 8px;
        }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(108,99,255,0.5); }
        .btn-register:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.3); transform: scale(0); animation: rippleAnim 0.6s linear; pointer-events: none; }
        @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

        .divider { display: flex; align-items: center; gap: 14px; margin: 22px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06); }
        .divider span { color: #445; font-size: 0.78rem; }
        .link-row { text-align: center; font-size: 0.87rem; color: #556; }
        .link-row a { color: #8b83ff; text-decoration: none; font-weight: 600; }
        .link-row a:hover { color: #fff; }

        .msg { padding: 11px 15px; border-radius: 11px; margin-top: 12px; font-size: 0.84rem; text-align: center; display: none; animation: slideDown 0.3s ease; }
        .msg.error { background: rgba(255,82,82,0.1); color: #ff6b6b; border: 1px solid rgba(255,82,82,0.2); display: block; }
        .msg.success { background: rgba(0,230,118,0.1); color: #00e676; border: 1px solid rgba(0,230,118,0.2); display: block; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Steps indicator */
        .steps-row { display: flex; gap: 8px; margin-bottom: 28px; }
        .step-dot { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.07); transition: background 0.4s; }
        .step-dot.active { background: linear-gradient(90deg, #6c63ff, #00d4ff); }
    </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="scene">
    <div class="glass-panel">
        <div class="logo-wrap">
            <div class="logo-3d">
                <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>
            </div>
            <div>
                <div class="logo-name">StockTracker</div>
                <div class="logo-sub">Pro Terminal</div>
            </div>
        </div>

        <div class="steps-row">
            <div class="step-dot active"></div>
            <div class="step-dot active"></div>
            <div class="step-dot"></div>
            <div class="step-dot"></div>
        </div>

        <h1 class="heading">Create your <span>account</span> ✨</h1>
        <p class="subheading">Start tracking stocks for free today</p>

        <div class="field">
            <label>Full Name</label>
            <div class="input-wrap">
                <span class="input-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
                <input type="text" id="name" placeholder="Your full name" autocomplete="name"/>
            </div>
        </div>

        <div class="field">
            <label>Email Address</label>
            <div class="input-wrap">
                <span class="input-icon"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
            </div>
        </div>

        <div class="field">
            <label>Password</label>
            <div class="input-wrap">
                <span class="input-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                <input type="password" id="password" placeholder="Min 6 characters" autocomplete="new-password"/>
            </div>
        </div>

        <div class="field">
            <label>Phone Number <span class="optional-tag">(for SMS alerts — optional)</span></label>
            <div class="input-wrap">
                <span class="input-icon"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.82a16 16 0 0 0 6.29 6.29l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
                <input type="tel" id="phone" placeholder="+91 9876543210"/>
            </div>
        </div>

        <button class="btn-register" onclick="register(this)" id="regBtn">Create Account →</button>
        <div id="msg" class="msg"></div>

        <div class="divider"><span>already a member?</span></div>
        <div class="link-row">Already have an account? <a href="/login">Sign in →</a></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
    const canvas = document.getElementById('bg-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x03030a, 1);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30;
    scene.fog = new THREE.FogExp2(0x03030a, 0.018);

    const particleCount = 1000;
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    const palette = [new THREE.Color(0x6c63ff), new THREE.Color(0x00d4ff), new THREE.Color(0x00e676), new THREE.Color(0xffffff)];
    for (let i = 0; i < particleCount; i++) {
        positions[i*3] = (Math.random()-0.5)*120; positions[i*3+1] = (Math.random()-0.5)*120; positions[i*3+2] = (Math.random()-0.5)*80;
        const c = palette[Math.floor(Math.random()*palette.length)];
        colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const mat = new THREE.PointsMaterial({ size: 0.3, vertexColors: true, transparent: true, opacity: 0.65 });
    const particles = new THREE.Points(geo, mat);
    scene.add(particles);

    // Torus rings
    function addRing(color, x, y, z, r, tube) {
        const g = new THREE.TorusGeometry(r, tube, 8, 60);
        const m = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.12, wireframe: true });
        const mesh = new THREE.Mesh(g, m);
        mesh.position.set(x, y, z);
        scene.add(mesh);
        return mesh;
    }
    const rings = [
        addRing(0x6c63ff, -15, 8, -15, 10, 0.08),
        addRing(0x00d4ff, 18, -10, -20, 8, 0.06),
        addRing(0x00e676, 0, 15, -10, 6, 0.05),
    ];

    const grid = new THREE.GridHelper(200, 40, 0x6c63ff, 0x111128);
    grid.position.y = -25; grid.material.opacity = 0.12; grid.material.transparent = true;
    scene.add(grid);

    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', e => { mouseX = (e.clientX/window.innerWidth-0.5)*2; mouseY = (e.clientY/window.innerHeight-0.5)*2; });

    let t = 0;
    function animate() {
        requestAnimationFrame(animate); t += 0.005;
        particles.rotation.y += 0.0003;
        rings[0].rotation.x = t * 0.4; rings[0].rotation.y = t * 0.2;
        rings[1].rotation.z = t * 0.3; rings[1].rotation.x = t * 0.15;
        rings[2].rotation.y = t * 0.5;
        camera.position.x += (mouseX * 3 - camera.position.x) * 0.03;
        camera.position.y += (-mouseY * 2 - camera.position.y) * 0.03;
        camera.lookAt(scene.position);
        renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
})();

function addRipple(btn, e) {
    const rect = btn.getBoundingClientRect();
    const r = document.createElement('span');
    r.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
    btn.appendChild(r);
    setTimeout(() => r.remove(), 600);
}

async function register(btn) {
    addRipple(btn, event);
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const phone = document.getElementById('phone').value.trim();
    const msg = document.getElementById('msg');
    if (!name || !email || !password) { msg.className = 'msg error'; msg.textContent = '⚠️ Please fill all required fields'; return; }
    if (password.length < 6) { msg.className = 'msg error'; msg.textContent = '⚠️ Password must be at least 6 characters'; return; }
    btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:8px;"><span style="width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;"></span> Creating account...</span>';
    btn.disabled = true;
    const res = await fetch('/api/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, phone })
    });
    const data = await res.json();
    if (data.error) {
        msg.className = 'msg error'; msg.textContent = '❌ ' + data.error;
        btn.textContent = 'Create Account →'; btn.disabled = false;
    } else {
        msg.className = 'msg success'; msg.textContent = '✅ Account created! Taking you to login...';
        setTimeout(() => window.location.href = '/login', 1200);
    }
}
</script>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
