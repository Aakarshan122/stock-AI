<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockTracker — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #03030a;
            color: #f0f0f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 3D Canvas Background */
        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* Glassmorphism overlay */
        .scene {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .glass-panel {
            width: 100%;
            max-width: 440px;
            background: rgba(8, 8, 20, 0.75);
            border: 1px solid rgba(108, 99, 255, 0.25);
            border-radius: 28px;
            padding: 48px 44px;
            backdrop-filter: blur(40px) saturate(180%);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.05) inset,
                0 40px 80px rgba(0,0,0,0.6),
                0 0 60px rgba(108,99,255,0.08);
            transform: translateY(40px);
            opacity: 0;
            animation: panelIn 0.9s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
        }

        @keyframes panelIn {
            to { transform: translateY(0); opacity: 1; }
        }

        /* Logo */
        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 36px;
        }
        .logo-3d {
            width: 52px; height: 52px;
            border-radius: 16px;
            background: linear-gradient(135deg, #6c63ff, #00d4ff);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 32px rgba(108,99,255,0.5), 0 0 0 1px rgba(255,255,255,0.1) inset;
            animation: logoFloat 3s ease-in-out infinite;
        }
        @keyframes logoFloat {
            0%,100% { transform: translateY(0) rotateZ(0deg); box-shadow: 0 8px 32px rgba(108,99,255,0.5); }
            50% { transform: translateY(-6px) rotateZ(2deg); box-shadow: 0 20px 50px rgba(108,99,255,0.7); }
        }
        .logo-3d svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .logo-text { display: flex; flex-direction: column; }
        .logo-name { font-size: 1.3rem; font-weight: 800; background: linear-gradient(135deg, #fff, #aaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-sub { font-size: 0.68rem; color: #556; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; margin-top: 1px; }

        /* Heading */
        .heading { font-size: 1.9rem; font-weight: 800; line-height: 1.1; margin-bottom: 8px; letter-spacing: -0.5px; }
        .heading span { background: linear-gradient(120deg, #6c63ff, #00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subheading { color: #556; font-size: 0.9rem; margin-bottom: 32px; }

        /* Form */
        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 0.75rem; font-weight: 600; color: #667; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .input-wrap { position: relative; }
        .input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #445; transition: color 0.2s; }
        .input-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .field input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 14px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.25s;
            outline: none;
        }
        .field input:focus {
            border-color: rgba(108,99,255,0.6);
            background: rgba(108,99,255,0.06);
            box-shadow: 0 0 0 3px rgba(108,99,255,0.12), 0 0 20px rgba(108,99,255,0.08);
        }
        .field input:focus ~ .input-icon,
        .input-wrap:focus-within .input-icon { color: #6c63ff; }
        .field input::placeholder { color: #334; }

        /* Button */
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6c63ff 0%, #00d4ff 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            margin-top: 6px;
            letter-spacing: 0.3px;
        }
        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(108,99,255,0.5), 0 0 0 1px rgba(255,255,255,0.1) inset; }
        .btn-login:hover::before { opacity: 1; }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Ripple */
        .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.3); transform: scale(0); animation: rippleAnim 0.6s linear; pointer-events: none; }
        @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

        /* Divider */
        .divider { display: flex; align-items: center; gap: 14px; margin: 24px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06); }
        .divider span { color: #445; font-size: 0.78rem; }

        /* Link */
        .link-row { text-align: center; font-size: 0.88rem; color: #556; }
        .link-row a { color: #8b83ff; text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .link-row a:hover { color: #fff; }

        /* Message */
        .msg { padding: 12px 16px; border-radius: 12px; margin-top: 14px; font-size: 0.85rem; text-align: center; display: none; animation: slideDown 0.3s ease; }
        .msg.error { background: rgba(255,82,82,0.1); color: #ff6b6b; border: 1px solid rgba(255,82,82,0.2); display: block; }
        .msg.success { background: rgba(0,230,118,0.1); color: #00e676; border: 1px solid rgba(0,230,118,0.2); display: block; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

        /* Floating stats */
        .float-stats {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 2;
            animation: fadeUp 1s ease 1s both;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .fstat {
            background: rgba(8,8,20,0.8);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 10px 18px;
            backdrop-filter: blur(20px);
            text-align: center;
        }
        .fstat-val { font-size: 1rem; font-weight: 800; color: #fff; }
        .fstat-label { font-size: 0.65rem; color: #556; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        @media (max-width: 500px) {
            .glass-panel { padding: 36px 28px; }
            .float-stats { display: none; }
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="scene">
    <div class="glass-panel">
        <div class="logo-wrap">
            <div class="logo-3d">
                <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>
            </div>
            <div class="logo-text">
                <span class="logo-name">StockTracker</span>
                <span class="logo-sub">Pro Terminal</span>
            </div>
        </div>

        <h1 class="heading">Welcome <span>back</span> 👋</h1>
        <p class="subheading">Sign in to your trading terminal</p>

        <div class="field">
            <label>Email Address</label>
            <div class="input-wrap">
                <span class="input-icon">
                    <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                </span>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
            </div>
        </div>

        <div class="field">
            <label>Password</label>
            <div class="input-wrap">
                <span class="input-icon">
                    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </span>
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
            </div>
        </div>

        <button class="btn-login" onclick="login(this)" id="loginBtn">Sign In →</button>
        <div id="msg" class="msg"></div>

        <div class="divider"><span>new here?</span></div>
        <div class="link-row">Don't have an account? <a href="/register">Create one free →</a></div>
    </div>
</div>

<div class="float-stats">
    <div class="fstat"><div class="fstat-val">50+</div><div class="fstat-label">Stocks Tracked</div></div>
    <div class="fstat"><div class="fstat-val">Live</div><div class="fstat-label">Market Data</div></div>
    <div class="fstat"><div class="fstat-val">AI</div><div class="fstat-label">Powered Alerts</div></div>
</div>

<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── 3D Background Scene ──────────────────────────────────────────────────────
(function() {
    const canvas = document.getElementById('bg-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x03030a, 1);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30;

    // Fog
    scene.fog = new THREE.FogExp2(0x03030a, 0.018);

    // ── Floating Particles ──
    const particleCount = 1200;
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    const sizes = new Float32Array(particleCount);

    const palette = [
        new THREE.Color(0x6c63ff),
        new THREE.Color(0x00d4ff),
        new THREE.Color(0x00e676),
        new THREE.Color(0xff6b6b),
        new THREE.Color(0xffffff),
    ];

    for (let i = 0; i < particleCount; i++) {
        positions[i * 3]     = (Math.random() - 0.5) * 120;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 120;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 80;
        const c = palette[Math.floor(Math.random() * palette.length)];
        colors[i * 3]     = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
        sizes[i] = Math.random() * 2.5 + 0.5;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    const mat = new THREE.PointsMaterial({
        size: 0.35,
        vertexColors: true,
        transparent: true,
        opacity: 0.7,
        sizeAttenuation: true,
    });

    const particles = new THREE.Points(geo, mat);
    scene.add(particles);

    // ── Glowing Orbs ──
    function makeOrb(color, x, y, z, radius) {
        const geo = new THREE.SphereGeometry(radius, 32, 32);
        const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.08 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);
        scene.add(mesh);

        // Wireframe ring
        const wGeo = new THREE.TorusGeometry(radius * 1.4, 0.05, 8, 60);
        const wMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.15, wireframe: false });
        const ring = new THREE.Mesh(wGeo, wMat);
        ring.position.set(x, y, z);
        ring.rotation.x = Math.PI / 2;
        scene.add(ring);
        return { mesh, ring };
    }

    const orb1 = makeOrb(0x6c63ff, -18, 10, -10, 8);
    const orb2 = makeOrb(0x00d4ff, 20, -8, -15, 6);
    const orb3 = makeOrb(0x00e676, 5, -18, -5, 4);

    // ── Floating Stock Chart Lines ──
    function makeChartLine(points, color, opacity) {
        const geo = new THREE.BufferGeometry().setFromPoints(points);
        const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
        return new THREE.Line(geo, mat);
    }

    function randomChart(ox, oy, oz, len, amp) {
        const pts = [];
        let y = oy;
        for (let i = 0; i < len; i++) {
            y += (Math.random() - 0.48) * amp;
            pts.push(new THREE.Vector3(ox + i * 0.6, y, oz));
        }
        return pts;
    }

    const lines = [];
    const lineColors = [0x6c63ff, 0x00d4ff, 0x00e676, 0xff6b6b];
    for (let i = 0; i < 8; i++) {
        const ox = (Math.random() - 0.5) * 60;
        const oy = (Math.random() - 0.5) * 30;
        const oz = -20 - Math.random() * 20;
        const pts = randomChart(ox, oy, oz, 20, 1.5);
        const line = makeChartLine(pts, lineColors[i % lineColors.length], 0.2 + Math.random() * 0.2);
        scene.add(line);
        lines.push(line);
    }

    // ── Grid Floor ──
    const gridHelper = new THREE.GridHelper(200, 40, 0x6c63ff, 0x111128);
    gridHelper.position.y = -25;
    gridHelper.material.opacity = 0.15;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // ── Mouse Parallax ──
    let mouseX = 0, mouseY = 0;
    document.addEventListener('mousemove', e => {
        mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    // ── Animate ──
    let t = 0;
    function animate() {
        requestAnimationFrame(animate);
        t += 0.005;

        particles.rotation.y += 0.0003;
        particles.rotation.x += 0.0001;

        // Orb float
        orb1.mesh.position.y = 10 + Math.sin(t * 0.7) * 3;
        orb1.ring.rotation.z = t * 0.3;
        orb2.mesh.position.y = -8 + Math.cos(t * 0.5) * 2;
        orb2.ring.rotation.x = t * 0.4;
        orb3.mesh.position.x = 5 + Math.sin(t * 0.9) * 2;
        orb3.ring.rotation.y = t * 0.5;

        // Chart lines drift
        lines.forEach((l, i) => {
            l.position.x += 0.01 * (i % 2 === 0 ? 1 : -1);
            if (Math.abs(l.position.x) > 30) l.position.x *= -0.5;
        });

        // Camera parallax
        camera.position.x += (mouseX * 3 - camera.position.x) * 0.03;
        camera.position.y += (-mouseY * 2 - camera.position.y) * 0.03;
        camera.lookAt(scene.position);

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
})();

// ── Login Logic ──────────────────────────────────────────────────────────────
function addRipple(btn, e) {
    const rect = btn.getBoundingClientRect();
    const r = document.createElement('span');
    r.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
    btn.appendChild(r);
    setTimeout(() => r.remove(), 600);
}

async function login(btn) {
    addRipple(btn, event);
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    if (!email || !password) { msg.className = 'msg error'; msg.textContent = '⚠️ Please fill all fields'; return; }
    btn.innerHTML = '<span style="display:inline-flex;align-items:center;gap:8px;"><span style="width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;"></span> Signing in...</span>';
    btn.disabled = true;
    const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.error) {
        msg.className = 'msg error'; msg.textContent = '❌ ' + data.error;
        btn.textContent = 'Sign In →'; btn.disabled = false;
    } else {
        msg.className = 'msg success'; msg.textContent = '✅ Welcome back! Loading dashboard...';
        setTimeout(() => window.location.href = '/dashboard', 900);
    }
}
document.addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
</script>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
